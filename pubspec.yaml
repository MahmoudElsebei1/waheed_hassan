name: waheed_hassan
description: "Wahid Hassan's men's suit application"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_gap: ^1.2.0
  flutter_screenutil_plus: ^1.5.0
  flutter_localization: ^0.3.3
  dotted_line: ^3.2.2
  dotted_border: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo/
    - assets/home_icons/
    - assets/nav_bar_icons/
    - assets/shared/
    - assets/product_details/
    - assets/mt_notifications/
    - assets/products_filtering/
    - assets/shopping_cart/
    - assets/notification/
    - assets/my_orders_assets/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200